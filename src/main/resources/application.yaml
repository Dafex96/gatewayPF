server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
      
        - id: ms_usuarios
          uri: lb://msUsuarios
          predicates:
            - Path=/api/usuarios/**

        - id: ms_cobranza
          uri: lb://msCobranza
          predicates:
            - Path=/api/cobranza/**
      
        - id: ms_habito
          uri: lb://msHabito
          predicates:
            - Path=/api/habito/**
        
        - id: ms_reportes
          uri: lb://msReportes
          predicates:
            - Path=/api/reportes/**
